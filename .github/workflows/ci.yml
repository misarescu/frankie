# Protected path: changes require a human gate (docs/spec/05-sandbox-and-toolchains.md).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      # Store tests; port and password match FRANKIE_TEST_DATABASE_URL in mise.toml.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: frankie
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v5.2.8
        with:
          cache: true
      - name: Generated code is up to date
        run: |
          mise run generate
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - run: mise run lint
      - run: mise run build
      - run: mise run test
      - run: mise run test:race
