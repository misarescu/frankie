# Protected path: changes require a human gate (docs/spec/05-sandbox-and-toolchains.md).
# Platform images (D23): built on every PR, pushed to GHCR on merges to main and,
# for previews of the factory (D131), on the heads of PRs from this repository.
name: images

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Pushed: merges to main (D23), and the heads of change requests from this
      # repository's own branches, which their previews run (D131). Change
      # requests from forks are built but never pushed.
      PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      # A change request is built from its head, not GitHub's merge commit: the
      # preview's chart comes from the head and its tag names the head.
      COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      DOCKER_METADATA_PR_HEAD_SHA: "true"
    strategy:
      fail-fast: false
      matrix:
        image: [runner, egress-proxy, controlplane, web]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.COMMIT }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/frankie-${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=main,enable={{is_default_branch}}
      # amd64 only: the homelab node is amd64, and Claude Code's binary crashes
      # under QEMU emulation, so cross-building other platforms is not reliable.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/images/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64
          # The control plane reports it at GET /api/version (D131).
          build-args: COMMIT=${{ env.COMMIT }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
