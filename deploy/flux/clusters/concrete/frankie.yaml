# The Frankie platform on the homelab k3s cluster (concrete profile).
# Applied by Flux once the cluster is bootstrapped with --path=deploy/flux/clusters/concrete.
apiVersion: v1
kind: Namespace
metadata:
  name: frankie
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: frankie
  namespace: frankie
spec:
  interval: 10m
  chart:
    spec:
      chart: ./deploy/helm/frankie
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      valuesFiles:
        - ./deploy/helm/frankie/values.yaml
        - ./deploy/helm/frankie/values-concrete.yaml
