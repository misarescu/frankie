# Laptop profile: 16 GiB, 4 cores, single-node k3s (docs/spec/09-deployment-profiles.md).
profile: laptop

scheduler:
  maxConcurrentIssues: 1
  sequentialReviewers: true

previews:
  maxConcurrent: 1

egressProxy:
  # No dependency proxy on the laptop: public package registries (docs/spec/09).
  allow:
    - proxy.golang.org
    - sum.golang.org
    - registry.npmjs.org
    - pypi.org
    - files.pythonhosted.org
