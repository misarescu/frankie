# Concrete profile (D24): one 16 GiB, 4-core laptop running single-node k3s (docs/spec/09-deployment-profiles.md).
profile: concrete

scheduler:
  maxConcurrentIssues: 1
  sequentialReviewers: true

previews:
  maxConcurrent: 1

egressProxy:
  # No dependency proxy in the concrete profile: public package registries (docs/spec/09).
  allow:
    - proxy.golang.org
    - sum.golang.org
    - registry.npmjs.org
    - pypi.org
    - files.pythonhosted.org

postgres:
  # The homelab host (Ubuntu 26.04, k3s containerd) denies signals between
  # Postgres processes under its AppArmor profile (open question 14).
  appArmorUnconfined: true
