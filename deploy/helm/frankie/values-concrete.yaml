# Concrete profile (D24): one 16 GiB, 4-core laptop running single-node k3s (docs/spec/09-deployment-profiles.md).
profile: concrete

scheduler:
  maxConcurrentIssues: 1
  sequentialReviewers: true

previews:
  maxConcurrent: 1

egressProxy:
  # No dependency proxy in the concrete profile: public package registries (docs/spec/09).
  allow:
    # Go modules come from the in-cluster module proxy (goModuleProxy, D37), so
    # neither proxy.golang.org nor the Cloud Storage it redirects to is listed.
    # The checksum database stays reachable: go verifies every module against it.
    - sum.golang.org
    - registry.npmjs.org
    - pypi.org
    - files.pythonhosted.org
    # Toolchain builds (D30): the base image from GHCR, mise and its aqua/GitHub
    # release downloads, Go toolchains. Agent pods share this list (D20).
    - ghcr.io
    - pkg-containers.githubusercontent.com
    - github.com
    - api.github.com
    - objects.githubusercontent.com
    - release-assets.githubusercontent.com
    - mise.jdx.dev
    - mise-versions.jdx.dev
    - go.dev
    - dl.google.com
    # Found by the first live toolchain build (Goodreads-Clone): sqlc releases,
    # and the Sigstore TUF root mise uses to verify GitHub artifact attestations.
    - downloads.sqlc.dev
    - tuf-repo-cdn.sigstore.dev
    # golangci-lint config verify downloads the config JSON schema (found by the first live gate).
    - golangci-lint.run
    # Frankie's own toolchain (M3 self-hosting, found by a trial build of its
    # mise.toml): atlas, helm and kubectl releases (dl.k8s.io redirects to the CDN).
    - release.ariga.io
    - get.helm.sh
    - dl.k8s.io
    - cdn.dl.k8s.io
    # Frankie's lint: kubeconform reads Kubernetes and CRD JSON schemas from GitHub.
    - raw.githubusercontent.com

llmGateway:
  # Anthropic plus OpenRouter (M4: one workflow uses two providers). Create
  # Secret frankie-openrouter with key api-key to enable OpenRouter.
  providers:
    - name: anthropic
      secret: frankie-anthropic
      models: [claude-opus-5-5, claude-sonnet-5-5, claude-haiku-5-5]
    - name: openrouter
      secret: frankie-openrouter
      # LiteLLM v1.106.6 has no prices for these: OpenRouter's, 2026-11-14.
      models:
        - { id: openai/gpt-5.6-terra, inputUSDPerMTok: 2, outputUSDPerMTok: 12 }
        - { id: openai/gpt-5.6-luna, inputUSDPerMTok: 0.2, outputUSDPerMTok: 1.2 }
        - { id: moonshotai/kimi-k2.7-code, inputUSDPerMTok: 0.6, outputUSDPerMTok: 3.5 }
        - { id: z-ai/glm-5.3, inputUSDPerMTok: 0.084, outputUSDPerMTok: 3.6 }

controlPlane:
  # One sidecar per pod: a 3Gi agent or gate pod keeps 2.5Gi for its own work.
  services:
    maxPerPod: 1
  # The toy repo of the M1 acceptance run, and Frankie itself (M3: self-hosting
  # begins, docs/spec/08); credentials in Secret frankie-github (D26).
  repos:
    - name: misarescu/Goodreads-Clone
      upstream: https://github.com/misarescu/Goodreads-Clone.git
      keyPrefix: gc
      baseBranch: main
    - name: misarescu/frankie
      upstream: https://github.com/misarescu/frankie.git
      keyPrefix: frk
      baseBranch: main
