# Defaults shared by all profiles. Profile files (values-<profile>.yaml) override
# only what differs; profiles are configuration, not forks (D18, docs/spec/09).

profile: full

scheduler:
  maxConcurrentIssues: 2
  sequentialReviewers: false

previews:
  # Maximum concurrent preview environments; 0 disables previews.
  maxConcurrent: 4

# Pod resources per pod type. The concrete-profile numbers are the documented baseline (FR-PR-3).
# Memory is requested at its limit; CPU requests are below the limits (D77), sized
# from the M5.1 samples (docs/spec/09), so pods that mostly wait for a model or
# for I/O do not keep others Pending on a node with idle cores.
podResources:
  coder:
    requests: { cpu: 500m }
    limits: { cpu: "2", memory: 3Gi }
  # Read-only agent steps (reviewers, the refiner) run with the coder's limits,
  # except a memory limit set here (D104): they read and judge, build nothing.
  reviewer:
    requests: { cpu: 250m }
    # limits: { memory: 2Gi }
  commandGate:
    requests: { cpu: "1" }
    limits: { cpu: "2", memory: 3Gi }

# Where platform pods run (D99). Agent, gate and build pods are not affected; on
# a cluster with an autoscaled pool, give the platform its own small fixed pool
# (nodeSelector plus a toleration for that pool's taint) so it never pins a burst
# node, and so agents keep off it. podAnnotations go on every platform pod.
platform:
  nodeSelector: {}
  tolerations: []
  podAnnotations: {}

# Storage class for every volume claim (Postgres, Temporal, registry, Go module
# proxy). Empty: the cluster's default class. Use one that keeps the volume when
# its claim is deleted, so an uninstall cannot drop Postgres (D99).
# ephemeral: no claims at all; each of those components keeps its data on an
# emptyDir sized like its claim, gone with the pod. For previews of the factory,
# which live for one check (D131); never for a factory whose state matters.
persistence:
  storageClassName: ""
  ephemeral: false

# Platform images (D23). Set images.tag per deployment, e.g. sha-87f0290.
images:
  registry: ghcr.io/misarescu
  tag: ""
  pullPolicy: IfNotPresent
  # Full image references per component, for verifying dev builds before they
  # are published, e.g. { controlplane: docker.io/library/frankie-controlplane:dev }.
  overrides: {}

# Whether the chart creates the agents and build namespaces. false when whoever
# installs it has no rights outside namespaces it was given: the previews of
# the factory, whose GitOps ResourceSet creates them and installs the chart
# with a service account bound only there (D138). They must then exist, with
# the Pod Security labels agents.podSecurity and toolchains.build.podSecurity.
namespaces:
  create: true

# Where agent and gate pods run (docs/spec/05-sandbox-and-toolchains.md).
agents:
  namespace: frankie-agents
  runtimeClassName: kata
  serviceAccountName: frankie-agent
  # Nodes every agent, gate, branch update and image build pod runs on, e.g.
  # an autoscaled agent pool apart from the platform's (D100). Empty: any node.
  nodeSelector: {}
  # Taints those pods tolerate (D101). Taint the agent pool and list its taint
  # here, so CoreDNS, Flux and other cluster pods stay on the platform pool and
  # the agent pool can scale to zero. kata-deploy must tolerate it too.
  tolerations: []
  # VM memory beyond each sandbox pod's container limits, for the guest kernel
  # and Kata agent (D103), e.g. 512Mi. Kata sizes a VM's RAM to the pod's
  # memory limit, so without it the guest runs out before a container reaches
  # its own limit. Set as the pod's pod-level memory (needs Kubernetes with
  # PodLevelResources); empty adds none.
  guestMemoryHeadroom: ""
  runnerPort: 7070
  # Pod Security Admission level enforced on the agents namespace.
  podSecurity: restricted
  verify:
    # Where release verification pods (role verify, D116) may also connect,
    # beyond a command gate's egress (D118): the stages they test, e.g. the
    # Tailscale operator's egress proxies to a homelab stage:
    #   stageEgress: [{namespace: tailscale, ports: [80]}]
    # or every namespace with these labels, e.g. the previews of the factory,
    # each in its own namespace (D131, D136):
    #   stageEgress: [{namespaceLabels: {frankie.dev/preview: "true"}, ports: [8080]}]
    # Agents and command gates never get it. Empty: verification reaches no stage
    # in the cluster, and a suite that cannot connect is inconclusive.
    stageEgress: []

# Toolchain images (D15, D30, docs/spec/05): built in-cluster by a one-off Job
# per image that appends a layer (D81), pushed to a plain registry:2 (docs/spec/09).
toolchains:
  registry:
    image: registry:2.8.3
    port: 5000
    storage: 10Gi
    # Nodes pull toolchain images as localhost:<nodePort>/...; containerd treats
    # loopback registries as plain HTTP, so nodes need no registry configuration.
    nodePort: 30500
    # 128Mi was OOM-killed receiving a dependency image's push (M5.2).
    resources:
      requests: { cpu: 10m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }
    # Registry collection (D84): every interval, when no build runs, the control
    # plane deletes the images nothing needs (beyond the newest `keep` per
    # repository and any built within minAge, and every base mirror but the
    # deployed runner's), then restarts the registry, whose init container
    # collects the garbage. An empty interval turns it off.
    collect:
      interval: 24h
      keep: 3
      minAge: 24h
  build:
    namespace: frankie-build
    # Builds append a layer as the unprivileged agent user (D81), so the
    # namespace enforces "restricted" like the agents'. Build pods also have no
    # token, no secrets and egress only to the proxy and registry.
    podSecurity: restricted
    serviceAccountName: frankie-build
    deadline: 50m
    # Bounds what a build writes: the install's files in the container, then
    # again as the layer archive.
    scratchSize: 30Gi
    # Builds are I/O-bound (median 0.15 CPU) but reached 2.87Gi of a 3Gi limit in M5.1.
    requests: { cpu: 250m }
    limits: { cpu: "2", memory: 4Gi }

# Control plane (docs/spec/01). Agents may reach only its git proxy port.
controlPlane:
  apiPort: 8080
  gitProxyPort: 8081
  # Command gates (docs/spec/03): re-run from the pushed commit in a fresh pod.
  # Limits come from podResources.commandGate.
  gate:
    commands: ["mise run lint", "mise run test"]
    deadline: 30m
    workspaceSize: 10Gi
  # Sidecar services repos declare in .factory/config.yaml (FR-SB-9). Each
  # service's limits come out of its pod's limits, so pods keep their budget.
  services:
    maxPerPod: 2
    cpu: 500m
    memory: 512Mi
  # Factory repos: served by the git proxy and polled for issues, until project
  # config sync exists. keyPrefix is the issue key prefix (D22) and never changes.
  repos: []
  #  - name: misarescu/frankie-toy
  #    upstream: https://github.com/misarescu/frankie-toy.git
  #    keyPrefix: toy
  #    baseBranch: main
  # Issues carrying this label are taken in (D27).
  intake:
    label: factory
    pollInterval: 30s
  # How agent steps run (docs/spec/04, docs/spec/05).
  agent:
    # Model ref of steps whose workflow and role name none; a provider must serve it.
    model: anthropic/claude-sonnet-5-5
    # Model spend caps in USD (D53): per agent session, and per issue across
    # all its runs unless the project sets budgets.issueUSD.
    budgetUSD: 2
    issueBudgetUSD: 20
    sessionTimeout: 90m
    idleTimeout: 20m
    podDeadline: 2h
    workspaceSize: 10Gi
    authorName: frankie-agent
    authorEmail: frankie-agent@users.noreply.github.com
  # Secret with key "token": fine-grained PAT for the repos (D26), with
  # Contents, Issues and Pull requests read/write, and Actions and Commit
  # statuses read for the merge queue (D85, D86). Optional until created; without
  # it the git proxy can only read public repos.
  githubSecret: frankie-github
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 300Mi }

# One Postgres for the app, Temporal and LiteLLM, separate databases (docs/spec/09).
postgres:
  image: postgres:17.12-trixie
  storage: 5Gi
  databases: [frankie, temporal, litellm]
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

# LLM gateway (LiteLLM, docs/spec/04): the only holder of real provider keys.
llmGateway:
  port: 4000
  image: ghcr.io/berriai/litellm-non_root:v1.106.6
  # Provider profiles (docs/spec/04, D48). A step's model ref <name>/<model>
  # is routed to the LiteLLM provider <name>, which must be one the control
  # plane knows (anthropic, openai, openrouter), for one of its models. The
  # gateway serves each model under its id without the provider, so ids are
  # unique across providers. secret: a Secret with key "api-key" holding the
  # provider's key; optional until created, never mounted in agent pods.
  # Optional per provider: apiBase (base URL), rpm and tpm (limits per model).
  # A model is its id, or {id, inputUSDPerMTok, outputUSDPerMTok} giving the
  # prices LiteLLM needs for models its own table lacks: without a price a
  # model's spend is zero and budgets never apply to it (D53).
  providers:
    - name: anthropic
      secret: frankie-anthropic
      models: [claude-opus-5-5, claude-sonnet-5-5, claude-haiku-5-5]
  # Extra peers the gateway admits besides its own agents and control plane
  # (NetworkPolicy "from" entries), and extra egress rules ("to" and "ports").
  # A factory whose previews chain their gateways to this one admits their
  # gateway pods (D131, D133); a preview's gateway may reach the gateway it uses
  # as its provider, which the public-HTTPS rule's private ranges exclude.
  ingressFrom: []
  egressTo: []
  # How often LiteLLM writes spend to its database; the control plane reads
  # each session's spend from there when the session ends (D53).
  spendWriteSeconds: 2
  # CPU is capped: an unbounded gateway once took all 4 cores of the concrete host.
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits: { cpu: "1", memory: 1Gi }
  # One-off schema migration Job, run on chart install/upgrade (the server itself
  # never migrates at boot).
  migration:
    activeDeadlineSeconds: 1200
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: "1", memory: 768Mi }

# In-cluster Go module proxy (Athens, D37, docs/spec/05 item 5). Agent, gate
# and toolchain build pods get GOPROXY pointing here, so the sandboxes need
# neither proxy.golang.org nor the Cloud Storage it redirects downloads to.
goModuleProxy:
  enabled: true
  image: gomods/athens:v0.20.0
  port: 3000
  storage: 10Gi
  # Where Athens itself fetches modules; it is platform code, not a sandbox.
  upstream: https://proxy.golang.org
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }

# Hostname-allowlisting CONNECT proxy, the agents' only route out (D20).
egressProxy:
  port: 3128
  # Hostnames agent pods may reach over HTTPS; profiles set the list.
  allow: []
  # Let projects add plain hostnames in .factory/config.yaml (egress.allow, D80):
  # each pod gets a signed token for its project's hosts. When false, a run of
  # a project that adds any fails with the reason.
  projectAllow: true
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 250m, memory: 64Mi }

# Temporal (D29): the single-binary dev server with SQLite on a volume.
temporal:
  image: temporalio/temporal:1.10.0
  namespace: frankie
  storage: 2Gi
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }

# Web UI (React + Bun).
web:
  # The UI; a preview of the factory runs without it (D131).
  enabled: true
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { cpu: 250m, memory: 256Mi }
