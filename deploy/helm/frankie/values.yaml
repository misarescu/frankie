# Defaults shared by all profiles. Profile files (values-<profile>.yaml) override
# only what differs; profiles are configuration, not forks (D18, docs/spec/09).

profile: full

scheduler:
  maxConcurrentIssues: 2
  sequentialReviewers: false

previews:
  # Maximum concurrent preview environments; 0 disables previews.
  maxConcurrent: 4

# Pod limits per pod type. The concrete-profile numbers are the documented baseline (FR-PR-3).
podResources:
  coder:
    limits: { cpu: "2", memory: 3Gi }
  reviewer:
    limits: { cpu: "1", memory: 2Gi }
  commandGate:
    limits: { cpu: "2", memory: 3Gi }

# Platform images (D23). Set images.tag per deployment, e.g. sha-87f0290.
images:
  registry: ghcr.io/misarescu
  tag: ""
  pullPolicy: IfNotPresent
  # Full image references per component, for verifying dev builds before they
  # are published, e.g. { controlplane: docker.io/library/frankie-controlplane:dev }.
  overrides: {}

# Where agent and gate pods run (docs/spec/05-sandbox-and-toolchains.md).
agents:
  namespace: frankie-agents
  runtimeClassName: kata
  serviceAccountName: frankie-agent
  runnerPort: 7070
  # Pod Security Admission level enforced on the agents namespace.
  podSecurity: restricted

# Toolchain images (D15, D30, docs/spec/05): built in-cluster by a one-off BuildKit
# Job per image, pushed to a plain registry:2 (docs/spec/09).
toolchains:
  registry:
    image: registry:2.8.3
    port: 5000
    storage: 10Gi
    # Nodes pull toolchain images as localhost:<nodePort>/...; containerd treats
    # loopback registries as plain HTTP, so nodes need no registry configuration.
    nodePort: 30500
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { cpu: 500m, memory: 128Mi }
  build:
    namespace: frankie-build
    # BuildKit runs as a privileged root container (D31), which Pod Security
    # refuses below "privileged". The Kata VM is the boundary: build pods have no
    # token, no secrets and egress only to the proxy and registry.
    podSecurity: privileged
    serviceAccountName: frankie-build
    buildkitImage: moby/buildkit:v0.35.0
    # A dependency image build (M3.1) unpacks the whole toolchain image before
    # the warm-up adds module and build caches: Frankie's went over 10Gi.
    deadline: 50m
    scratchSize: 30Gi
    limits: { cpu: "2", memory: 3Gi }

# Control plane (docs/spec/01). Agents may reach only its git proxy port.
controlPlane:
  apiPort: 8080
  gitProxyPort: 8081
  # Command gates (docs/spec/03): re-run from the pushed commit in a fresh pod.
  # Limits come from podResources.commandGate.
  gate:
    commands: ["mise run lint", "mise run test"]
    deadline: 30m
    workspaceSize: 10Gi
  # Sidecar services repos declare in .factory/config.yaml (FR-SB-9). Each
  # service's limits come out of its pod's limits, so pods keep their budget.
  services:
    maxPerPod: 2
    cpu: 500m
    memory: 512Mi
  # Factory repos: served by the git proxy and polled for issues, until project
  # config sync exists. keyPrefix is the issue key prefix (D22) and never changes.
  repos: []
  #  - name: misarescu/frankie-toy
  #    upstream: https://github.com/misarescu/frankie-toy.git
  #    keyPrefix: toy
  #    baseBranch: main
  # Issues carrying this label are taken in (D27).
  intake:
    label: factory
    pollInterval: 30s
  # How agent steps run (docs/spec/04, docs/spec/05).
  agent:
    # Model ref of steps whose workflow and role name none; a provider must serve it.
    model: anthropic/claude-sonnet-5-5
    budgetUSD: 2
    sessionTimeout: 90m
    idleTimeout: 20m
    podDeadline: 2h
    workspaceSize: 10Gi
    authorName: frankie-agent
    authorEmail: frankie-agent@users.noreply.github.com
  # Secret with key "token": fine-grained PAT for the repos (D26). Optional
  # until created; without it the git proxy can only read public repos.
  githubSecret: frankie-github
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 300Mi }

# One Postgres for the app, Temporal and LiteLLM, separate databases (docs/spec/09).
postgres:
  image: postgres:17.12-trixie
  storage: 5Gi
  databases: [frankie, temporal, litellm]
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

# LLM gateway (LiteLLM, docs/spec/04): the only holder of real provider keys.
llmGateway:
  port: 4000
  image: ghcr.io/berriai/litellm-non_root:v1.106.6
  # Provider profiles (docs/spec/04, D48). A step's model ref <name>/<model>
  # is routed to the LiteLLM provider <name>, which must be one the control
  # plane knows (anthropic, openai, openrouter), for one of its models. The
  # gateway serves each model under its id without the provider, so ids are
  # unique across providers. secret: a Secret with key "api-key" holding the
  # provider's key; optional until created, never mounted in agent pods.
  # Optional per provider: apiBase (base URL), rpm and tpm (limits per model).
  providers:
    - name: anthropic
      secret: frankie-anthropic
      models: [claude-opus-5-5, claude-sonnet-5-5, claude-haiku-5-5]
  # CPU is capped: an unbounded gateway once took all 4 cores of the concrete host.
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits: { cpu: "1", memory: 1Gi }
  # One-off schema migration Job, run on chart install/upgrade (the server itself
  # never migrates at boot).
  migration:
    activeDeadlineSeconds: 1200
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: "1", memory: 768Mi }

# In-cluster Go module proxy (Athens, D37, docs/spec/05 item 5). Agent, gate
# and toolchain build pods get GOPROXY pointing here, so the sandboxes need
# neither proxy.golang.org nor the Cloud Storage it redirects downloads to.
goModuleProxy:
  enabled: true
  image: gomods/athens:v0.20.0
  port: 3000
  storage: 10Gi
  # Where Athens itself fetches modules; it is platform code, not a sandbox.
  upstream: https://proxy.golang.org
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }

# Hostname-allowlisting CONNECT proxy, the agents' only route out (D20).
egressProxy:
  port: 3128
  # Hostnames agent pods may reach over HTTPS; profiles set the list.
  allow: []
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 250m, memory: 64Mi }

# Temporal (D29): the single-binary dev server with SQLite on a volume.
temporal:
  image: temporalio/temporal:1.10.0
  namespace: frankie
  storage: 2Gi
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }

# Web UI (React + Bun).
web:
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { cpu: 250m, memory: 256Mi }
