# Frankie (docs/spec/09, D28): Ubuntu 26.04 sets this to 1, which makes runc stack
# containerd's AppArmor profile (cri-containerd.apparmor.d//&unconfined) and the
# default profile then denies signals between a container's own processes
# (containerd#12886, #14485). Remove once k3s ships the containerd fix.
kernel.apparmor_restrict_unprivileged_unconfined = 0
