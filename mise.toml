# Single source of truth for tool versions and dev tasks.
# Humans, CI and factory agents all run `mise run <task>`.
# Protected path: changes require a human gate (docs/spec/05-sandbox-and-toolchains.md).

[settings]
lockfile = true

[tools]
go = "1.27.4"
golangci-lint = "2.15.0"
buf = "1.75.0"
protoc-gen-go = "1.36.12"
protoc-gen-go-grpc = "1.6.2"
sqlc = "1.31.1"
atlas = "1.3.0"
bun = "1.4.4"
helm = "4.3.1"
kubectl = "1.37.2"
flux2 = "2.10.0"
kubeconform = "0.8.0"
temporal = "1.10.0"
actionlint = "1.7.12"
shellcheck = "0.11.0"
# Must match github.com/onsi/ginkgo/v2 in go.mod.
ginkgo = "2.34.0"
# The runner's opencode adapter test runs it against a fake model endpoint;
# must match OPENCODE_VERSION in deploy/images/runner/Dockerfile.
"github:anomalyco/opencode" = "2.2.7"

[env]
CGO_ENABLED = "0"
# Admin URL for store tests; each test creates and drops its own database. CI uses the same port.
FRANKIE_TEST_DATABASE_URL = "postgres://postgres:frankie@localhost:55432/postgres?sslmode=disable"

[tasks.doctor]
description = "Check required tools and external prerequisites"
run = "scripts/doctor.sh"

[tasks.build]
description = "Build all binaries into bin/"
run = "go build -o bin/ ./cmd/..."

[tasks.test]
description = "Run unit tests: Go (extra args are passed to go test) and the web UI"
depends = ["web:install"]
run = ["go test ./...", "cd web && bun test"]

[tasks."test:race"]
description = "Run unit tests under the race detector (needs cgo)"
env = { CGO_ENABLED = "1" }
run = "go test -race ./..."

[tasks."test:smoke-claude"]
description = "Smoke-test the Claude Code adapter against the real claude CLI (spends model usage)"
run = "go test -tags smoke -count=1 -v -timeout 5m -run '^TestSmokeRealClaude$' ./internal/runner/claudecode/"

[tasks.e2e]
description = "Run cluster acceptance tests (Ginkgo, build tag e2e; see e2e/e2e_suite_test.go)"
run = "ginkgo --tags=e2e -v ./e2e"

[tasks."deps:warm"]
description = "Download and pre-compile dependencies; the factory runs it to build Frankie's dependency image (M3.1)"
run = [
  "go mod download",
  # Compile every dependency package Frankie imports into the build cache.
  "grep -v '^#' go-packages.txt | xargs go build",
  "cd web && bun install --frozen-lockfile",
]

[tasks.generate]
description = "Regenerate committed code (protobuf, sqlc)"
run = "scripts/generate.sh"

[tasks.lint]
description = "Lint Go, protobuf, shell, CI config and deploy manifests"
depends = ["web:install"]
run = [
  "golangci-lint run",
  "cd web && bun run typecheck",
  "scripts/lint-proto.sh",
  "shellcheck scripts/*.sh",
  "actionlint",
  "scripts/lint-deploy.sh",
]

[tasks."web:install"]
description = "Install web UI dependencies (bun.lock)"
dir = "web"
run = "bun install --frozen-lockfile"

[tasks."web:dev"]
description = "Run the web UI with hot reload, proxying /api to CONTROLPLANE_URL (default localhost:8080)"
dir = "web"
depends = ["web:install"]
run = "bun run dev"

[tasks."db:up"]
description = "Start the local dev/test Postgres (Docker, port 55432)"
run = "scripts/db-up.sh"

[tasks."db:down"]
description = "Remove the local dev/test Postgres container"
run = "docker rm -f frankie-dev-postgres"

[tasks."db:diff"]
description = "Generate a goose migration from internal/store/schema.sql (usage: mise run db:diff <name>); needs Docker"
run = "atlas migrate diff --env local"

[tasks."db:hash"]
description = "Recompute the migration directory checksum after editing a migration by hand"
run = "atlas migrate hash --env local"
