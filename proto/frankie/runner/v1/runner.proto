syntax = "proto3";

package frankie.runner.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// RunnerService runs one agent session per pod (one pod per workflow step).
// The control plane is its only client (docs/spec/04-agents-harnesses-models.md).
//
// Lifecycle: Start, then Prompt exactly once with the task. Steer may add
// messages while the session runs; the harness sees them at its next turn
// boundary. The session ends once the harness has answered every message, or on
// Abort or a timeout. The event stream always ends with one EVENT_TYPE_DONE.
service RunnerService {
  // Start launches the harness. Only one session per runner.
  rpc Start(StartRequest) returns (StartResponse);
  // Prompt sends the task. Allowed once, after Start.
  rpc Prompt(PromptRequest) returns (PromptResponse);
  // Steer injects a message into the running session.
  rpc Steer(SteerRequest) returns (SteerResponse);
  // Abort stops the session; the stream ends with done status "aborted".
  rpc Abort(AbortRequest) returns (AbortResponse);
  // Events replays the session's events after after_seq, then follows live
  // events until done. Reconnect with the last seen seq to resume.
  rpc Events(EventsRequest) returns (stream EventsResponse);
}

// Harness identifies the agent CLI the runner drives.
enum Harness {
  HARNESS_UNSPECIFIED = 0;
  HARNESS_CLAUDE_CODE = 1;
  HARNESS_OPENCODE = 2;
}

// ModelAPI is the wire protocol the gateway serves a model with natively: the
// API of its provider (D48). The adapter configures its harness to speak it.
enum ModelAPI {
  MODEL_API_UNSPECIFIED = 0;
  MODEL_API_ANTHROPIC = 1; // Anthropic Messages
  MODEL_API_OPENAI = 2; // OpenAI-compatible chat completions
}

// Gateway is how the session reaches its model: the LLM gateway and the run's
// short-lived virtual key (invariant 1). Each adapter turns it into its
// harness's own configuration.
message Gateway {
  // Base URL of the gateway, without an API path, e.g. http://frankie-llm-gateway.frankie.svc:4000.
  string base_url = 1;
  // The virtual key. Never a real provider key.
  string api_key = 2;
  ModelAPI api = 3;
}

message StartRequest {
  // Correlates the session with the control plane's StepRun.
  string step_run_id = 1;
  Harness harness = 2;
  // Model name as the gateway exposes it.
  string model = 3;
  // Role system prompt, appended to the harness's own.
  string system_prompt = 4;
  // Extra environment for the harness. Never real provider keys (invariant 1).
  // Control planes before gateway set Claude Code's gateway variables here.
  map<string, string> env = 5;
  // Wall-clock limit for the whole session (FR-AG-3). Zero means no limit.
  google.protobuf.Duration timeout = 6;
  // Limit on time without any harness output (FR-AG-3). Zero means no limit.
  google.protobuf.Duration idle_timeout = 7;
  // Upper bound on agent turns, if the harness supports it. Zero means harness default.
  int32 max_turns = 8;
  // Git workspace to prepare before the harness starts. Unset: the harness works
  // in the runner's workdir as it is.
  Workspace workspace = 9;
  // Tools the session may use, by harness-neutral name (a role's allowed_tools,
  // docs/spec/03): read, grep, glob, edit, write, bash, bash:readonly (a shell
  // limited to commands that do not change the workspace), web-fetch. Empty
  // means the harness's default tools. The adapter refuses names it cannot map.
  repeated string allowed_tools = 10;
  // The LLM gateway and virtual key. Adapters prefer it over harness-specific
  // variables in env, which older control planes set instead.
  Gateway gateway = 11;
}

// Workspace is the step's git checkout (FR-SB-6). Start clones base_ref through
// the control plane git proxy and checks out branch; when the session succeeds
// the runner commits any remaining changes, pushes branch, and reports the commit
// in the done event. Nothing is pushed when the session fails or is aborted, or
// when the workspace is read-only.
message Workspace {
  // Git proxy URL of the repo, e.g. http://controlplane:8081/git/misarescu/toy.git.
  string clone_url = 1;
  // Per-step git proxy token (D21). Never written to disk.
  string token = 2;
  // Branch to start from: main for a first step, the issue branch afterwards.
  string base_ref = 3;
  // Branch to push, agent/<issue-key>/<slug> (D22).
  string branch = 4;
  // Message for the runner's commit of uncommitted changes.
  string commit_message = 5;
  string author_name = 6;
  string author_email = 7;
  // Read-only checkout, for reviewers: nothing is committed or pushed, and the
  // done event reports the commit that was checked out. commit_message and the
  // author are not needed.
  bool read_only = 8;
  // Branch fetched as origin/<compare_ref> next to base_ref, so the agent can
  // diff its branch against it (e.g. the issue's base branch when base_ref is
  // the agent branch). Empty or equal to base_ref: nothing extra is fetched.
  string compare_ref = 9;
}

message StartResponse {
  // Runner-assigned session ID.
  string session_id = 1;
}

message PromptRequest {
  string text = 1;
}

message PromptResponse {}

message SteerRequest {
  string text = 1;
}

message SteerResponse {}

message AbortRequest {
  string reason = 1;
}

message AbortResponse {}

message EventsRequest {
  // Return events with seq greater than this; 0 replays from the start.
  int64 after_seq = 1;
}

message EventsResponse {
  Event event = 1;
}

// EventType is the normalized harness event type.
enum EventType {
  EVENT_TYPE_UNSPECIFIED = 0;
  // payload: {"text": string}
  EVENT_TYPE_ASSISTANT_MESSAGE = 1;
  // payload: {"id": string, "name": string, "input": object}
  EVENT_TYPE_TOOL_CALL = 2;
  // payload: {"tool_call_id": string, "name": string, "content": string, "is_error": bool}
  EVENT_TYPE_TOOL_RESULT = 3;
  // One changed file of the pushed branch, against the base commit (unified diff,
  // capped at 256 KiB). Emitted just before done.
  // payload: {"path": string, "diff": string}
  EVENT_TYPE_FILE_DIFF = 4;
  // Result of a shell tool call.
  // payload: {"tool_call_id": string, "output": string, "is_error": bool}
  EVENT_TYPE_COMMAND_OUTPUT = 5;
  // Running session totals, emitted when the harness finishes answering a message.
  // payload: {"input_tokens", "output_tokens", "cache_read_input_tokens",
  //           "cache_creation_input_tokens": int, "cost_usd": number, "turns": int}
  EVENT_TYPE_TOKEN_USAGE = 6;
  // payload: {"message": string, "detail": string}
  EVENT_TYPE_ERROR = 7;
  // Last event of every session.
  // payload: {"status": "succeeded"|"failed"|"aborted"|"timeout", "reason": string,
  //           "result": string, "harness_session_id": string, "exit_code": int,
  //           "branch": string, "commit_sha": string, "pushed": bool}
  // With a workspace and status succeeded: branch is set, pushed tells whether the
  // session changed anything, and commit_sha is the pushed head (or the base
  // commit when nothing changed). A failed push turns the status into failed.
  EVENT_TYPE_DONE = 8;
}

message Event {
  // Strictly increasing within a session, starting at 1.
  int64 seq = 1;
  google.protobuf.Timestamp time = 2;
  EventType type = 3;
  // JSON object; schema per EventType.
  bytes payload = 4;
}
